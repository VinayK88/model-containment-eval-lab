<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity=".05"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}.i{fill:#1d1d1f}.m{fill:#6e6e73}.b{fill:#0071e3}.l{font-size:11px;font-weight:700;letter-spacing:1px;fill:#86868b}.v{font-size:24px;font-weight:650;letter-spacing:-.8px;fill:#1d1d1f}.card{fill:#f5f5f7;stroke:#e8e8ed}.sec{font-size:20px;font-weight:650;letter-spacing:-.5px;fill:#1d1d1f}</style></defs><rect width="1200" height="640" rx="28" fill="#fff"/><text x="50" y="50" class="b" font-size="12" font-weight="700" letter-spacing="1.6">MODEL CONTAINMENT EVAL LAB</text><text x="50" y="94" class="i" font-size="36" font-weight="650" letter-spacing="-1.5">Measure containment without hiding the trace.</text><text x="50" y="123" class="m" font-size="14">Tripwires, shutdown compliance, strict-vs-audit controls, and learned trace risk inside an in-memory evaluation boundary.</text><rect x="922" y="45" width="228" height="36" rx="18" fill="#f5f5f7"/><circle cx="942" cy="63" r="5" fill="#34c759"/><text x="956" y="67" class="i" font-size="11" font-weight="650">In-memory environment ready</text><g filter="url(#s)"><rect class="card" x="50" y="158" width="255" height="100" rx="24"/><rect class="card" x="320" y="158" width="255" height="100" rx="24"/><rect class="card" x="590" y="158" width="255" height="100" rx="24"/><rect class="card" x="860" y="158" width="290" height="100" rx="24"/></g><text x="72" y="188" class="l">ENVIRONMENT</text><text x="72" y="228" class="v">In-memory</text><text x="342" y="188" class="l">STRICT PROFILE</text><text x="342" y="228" class="v">Deny + trace</text><text x="612" y="188" class="l">MONITOR</text><text x="612" y="228" class="v">Learned + rule</text><text x="882" y="188" class="l">HOST ACCESS</text><text x="882" y="228" class="v">None</text><rect x="50" y="290" width="525" height="278" rx="28" class="card"/><text x="76" y="328" class="sec">Containment evidence</text><text x="76" y="352" class="m" font-size="13">Intent and defense are measured separately.</text><circle cx="82" cy="398" r="5" fill="#ff3b30"/><text x="100" y="403" class="i" font-size="13">Violation attempts remain in immutable traces</text><circle cx="82" cy="443" r="5" fill="#34c759"/><text x="100" y="448" class="i" font-size="13">Strict controls deny prohibited simulated effects</text><circle cx="82" cy="488" r="5" fill="#ff9f0a"/><text x="100" y="493" class="i" font-size="13">Tripwires map independent signals to unsafe events</text><circle cx="82" cy="533" r="5" fill="#0071e3"/><text x="100" y="538" class="i" font-size="13">Trace-risk monitor remains auditable and held-out tested</text><rect x="595" y="290" width="555" height="278" rx="28" class="card"/><text x="621" y="328" class="sec">Evaluation boundary</text><text x="621" y="352" class="m" font-size="13">No host filesystem, shell, network, or real credentials.</text><rect x="621" y="390" width="490" height="44" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="417" class="i" font-size="12" font-weight="650">STRICT → deny prohibited action + record</text><rect x="621" y="448" width="490" height="44" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="475" class="i" font-size="12" font-weight="650">AUDIT → simulate effect + record</text><rect x="621" y="506" width="490" height="44" rx="14" fill="#fff" stroke="#d2d2d7"/><text x="642" y="533" class="i" font-size="12" font-weight="650">Compare attempt · effect · detection · compliance</text><text x="50" y="608" class="m" font-size="11">In-memory evaluation abstraction only · not evidence that a named production model attempts containment escape</text></svg>