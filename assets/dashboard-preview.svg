<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Model Containment Eval Lab dashboard preview</title><desc id="desc">Static synthetic dashboard preview for containment controls, tripwires, shutdown compliance, and learned trace-risk monitoring.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b111a"/><stop offset="1" stop-color="#241b32"/></linearGradient></defs><rect width="1200" height="640" rx="24" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="48" y="58" font-size="30" font-weight="800" fill="#f8fafc">Model Containment Eval Lab</text><text x="48" y="87" font-size="13" font-weight="700" letter-spacing="1.4" fill="#c4b5fd">CONTAINMENT · TRIPWIRES · SHUTDOWN · TRACE RISK</text><text x="1148" y="63" text-anchor="end" font-size="12" font-weight="700" fill="#94a3b8">STATIC / SYNTHETIC PREVIEW</text><rect x="48" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="68" y="147" font-size="11" font-weight="700" fill="#94a3b8">ENVIRONMENT</text><text x="68" y="184" font-size="24" font-weight="800" fill="#f8fafc">IN-MEMORY</text><rect x="323" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="343" y="147" font-size="11" font-weight="700" fill="#94a3b8">STRICT PROFILE</text><text x="343" y="184" font-size="24" font-weight="800" fill="#4ade80">DENY + TRACE</text><rect x="598" y="118" width="255" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="618" y="147" font-size="11" font-weight="700" fill="#94a3b8">MONITOR</text><text x="618" y="184" font-size="24" font-weight="800" fill="#c4b5fd">LEARNED + RULE</text><rect x="873" y="118" width="279" height="92" rx="15" fill="#171827" stroke="#403653"/><text x="893" y="147" font-size="11" font-weight="700" fill="#94a3b8">HOST ACCESS</text><text x="893" y="184" font-size="24" font-weight="800" fill="#f8fafc">NONE</text><rect x="48" y="236" width="535" height="306" rx="18" fill="#141522" stroke="#403653"/><text x="72" y="272" font-size="18" font-weight="800" fill="#f8fafc">Containment evidence</text><text x="72" y="298" font-size="12" fill="#94a3b8">Intent and defense are measured separately</text><circle cx="78" cy="343" r="6" fill="#f87171"/><text x="96" y="348" font-size="14" font-weight="650" fill="#e0e7ff">Violation attempts remain in immutable traces</text><circle cx="78" cy="391" r="6" fill="#4ade80"/><text x="96" y="396" font-size="14" font-weight="650" fill="#e0e7ff">Strict controls deny prohibited simulated effects</text><circle cx="78" cy="439" r="6" fill="#f59e0b"/><text x="96" y="444" font-size="14" font-weight="650" fill="#e0e7ff">Tripwires map independent signals to unsafe events</text><circle cx="78" cy="487" r="6" fill="#a78bfa"/><text x="96" y="492" font-size="14" font-weight="650" fill="#e0e7ff">Trace-risk monitor is auditable and held-out tested</text><rect x="607" y="236" width="545" height="306" rx="18" fill="#141522" stroke="#403653"/><text x="631" y="272" font-size="18" font-weight="800" fill="#f8fafc">Evaluation boundary</text><text x="631" y="298" font-size="12" fill="#94a3b8">No host filesystem, shell, network or real credentials</text><rect x="631" y="335" width="472" height="50" rx="11" fill="#10291f" stroke="#166534"/><text x="651" y="366" font-size="13" font-weight="800" fill="#4ade80">STRICT → DENY PROHIBITED ACTION + RECORD</text><rect x="631" y="401" width="472" height="50" rx="11" fill="#302410" stroke="#a16207"/><text x="651" y="432" font-size="13" font-weight="800" fill="#fbbf24">AUDIT → SIMULATE EFFECT + RECORD</text><rect x="631" y="467" width="472" height="50" rx="11" fill="#211c38" stroke="#6d28d9"/><text x="651" y="498" font-size="13" font-weight="800" fill="#c4b5fd">COMPARE ATTEMPT · EFFECT · DETECTION · COMPLIANCE</text><text x="48" y="592" font-size="12" fill="#94a3b8">Preview reflects an in-memory evaluation abstraction; it is not evidence that a named production model attempts containment escape.</text></g></svg>