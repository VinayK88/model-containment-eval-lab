[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-containment-eval-lab"
version = "0.1.0"
description = "Safe, simulation-only evaluations for agent containment, shutdown compliance, tripwires, and trace monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Vinay K"}]
dependencies = []

[project.scripts]
containment-eval = "model_containment_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
